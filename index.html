>`).join('')}</select></label><label class="field">写真（最大10枚）<input type="file" accept="image/*" multiple onchange="addPhotos(this.files)"></label><div class="hint" id="progress"></div><div class="thumbs" id="thumbs"></div><label class="field">キャプション・ハッシュタグ<textarea name="caption" oninput="editorDirty=true">${esc(p?.caption||'')}</textarea></label><label class="field">投稿日<input name="date" type="date" value="${(p?.date||new Date().toISOString()).slice(0,10)}" onchange="editorDirty=true"></label><button class="primary" id="submitpost">${p?'変更を保存':'投稿する'}</button></form>`,true);$('#postform').dataset.id=d.id||'';drawThumbs()}function drawThumbs(){let el=$('#thumbs');if(el)el.innerHTML=editorPhotos.map((src,i)=>`<div class="thumb"><img src="${src}"><button type="button" onclick="editorPhotos.splice(${i},1);editorDirty=true;drawThumbs()">×</button></div>`).join('')}async function addPhotos(files){let chosen=[...files].slice(0,10-editorPhotos.length);if(!chosen.length)return toast('写真は最大10枚です');$('#progress').textContent='写真を圧縮しています…';try{for(let f of chosen){editorPhotos.push(await compress(f));drawThumbs()}window.editorDirty=true;$('#progress').textContent=`${editorPhotos.length}枚の写真を選択中`}catch(e){toast('写真を読み込めませんでした')} }async function savePost(e){e.preventDefault();if(busy)return;let form=e.target,old=posts.find(p=>p.id===form.dataset.id);if(!editorPhotos.length)return toast('写真を1枚以上選択してください');if(!form.account.value)return toast('先にアカウントを作成してください');busy=true;$('#submitpost').disabled=true;try{let p={id:old?.id||id(),accountId:form.account.value,photos:[...editorPhotos],caption:form.caption.value,date:form.date.value||new Date().toISOString().slice(0,10),created:old?.created||Date.now(),liked:old?.liked||false,saved:old?.saved||false};await put('posts',p);await refresh();window.editorDirty=false;back();toast('投稿を保存しました')}catch(err){toast('保存に失敗しました。空き容量を確認して再試行してください')}finally{busy=false;$('#submitpost')&&($('#submitpost').disabled=false)}}function renderAccountEdit(d){let a=accounts.find(x=>x.id===d.id);base(header(a?'アカウント編集':'アカウント作成')+`<form class="section" onsubmit="saveAccount(event)" data-id="${a?.id||''}"><label class="field">アイコン写真<input type="file" accept="image/*" onchange="setAvatar(this.files[0])"></label><div class="avatar" id="editavatar">${a?avatar(a):'👤'}</div><label class="field">ユーザー名<input name="username" required value="${esc(a?.username||'')}" oninput="editorDirty=true"></label><label class="field">表示名<input name="name" value="${esc(a?.name||'')}" oninput="editorDirty=true"></label><label class="field">自己紹介<textarea name="bio" oninput="editorDirty=true">${esc(a?.bio||'')}</textarea></label><label class="field">フォロワー数<input type="number" min="0" name="followers" value="${a?.followers||0}" oninput="editorDirty=true"></label><label class="field">フォロー中の数<input type="number" min="0" name="following" value="${a?.following||0}" oninput="editorDirty=true"></label><div class="row"><button class="primary">保存</button>${a?'<button type="button" class="danger" onclick="deleteAccount()">アカウント削除</button>':''}</div></form>`,true);window.editAvatar=a?.avatar||'';window.editorDirty=false}async function setAvatar(f){if(!f)return;try{window.editAvatar=await compress(f);$('#editavatar').innerHTML=`<img src="${window.editAvatar}">`;window.editorDirty=true}catch{toast('写真を読み込めませんでした')}}async function saveAccount(e){e.preventDefault();let f=e.target,a=accounts.find(x=>x.id===f.dataset.id);let item={id:a?.id||id(),username:f.username.value.trim(),name:f.name.value.trim(),bio:f.bio.value,followers:Math.max(0,+f.followers.value||0),following:Math.max(0,+f.following.value||0),avatar:window.editAvatar,order:a?.order??accounts.length,created:a?.created||Date.now()};try{await put('accounts',item);if(!selectedAccount)await setSetting('selectedAccount',item.id);await refresh();window.editorDirty=false;back();toast('アカウントを保存しました')}catch{toast('保存できませんでした')}}async function deleteAccount(){let a=accounts.find(x=>x.id===stack.at(-1).data.id);if(!a||!confirm(`「${a.username}」とその投稿をすべて削除しますか？`))return;try{let t=db.transaction(['accounts','posts'],'readwrite');t.objectStore('accounts').delete(a.id);posts.filter(p=>p.accountId===a.id).forEach(p=>t.objectStore('posts').delete(p.id));await txDone(t);await refresh();if(selectedAccount===a.id)await setSetting('selectedAccount',accounts[0]?.id||'');window.editorDirty=false;back();toast('アカウントを削除しました')}catch{toast('削除できませんでした')}}function renderSettings(){base(header('設定')+`<div class="section"><div class="settingsline"><span>JSONバックアップを書き出す</span><button class="secondary" onclick="exportBackup()">書き出し</button></div><div class="settingsline"><span>JSONから復元する</span><label class="secondary">ファイル選択<input type="file" accept=".json,application/json" hidden onchange="importBackup(this.files[0])"></label></div><p class="hint">復元すると現在のアカウントと投稿はすべて置き換わります。データはこの端末内に保存され、サーバーには送信されません。</p><div class="settingsline"><span>保存データの推定サイズ</span><span>${(new Blob([JSON.stringify({accounts,posts,settings})]).size/1048576).toFixed(2)} MB</span></div><p class="hint">Photo Memo · オフライン対応</p></div>`,true)}function exportBackup(){let d=new Date(),pad=n=>String(n).padStart(2,'0'),filename=`PhotoMemo_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;let blob=new Blob([JSON.stringify({app:'Photo Memo',version:1,exportedAt:d.toISOString(),accounts,posts,settings},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importBackup(file){if(!file)return;try{let data=JSON.parse(await file.text());if(data.app!=='Photo Memo'||!Array.isArray(data.accounts)||!Array.isArray(data.posts)||!data.accounts.every(a=>a.id&&typeof a.username==='string')||!data.posts.every(p=>p.id&&p.accountId&&Array.isArray(p.photos)&&p.photos.length>=1&&p.photos.length<=10&&p.photos.every(s=>typeof s==='string'&&s.startsWith('data:image/'))))throw Error('形式が正しくありません');if(!confirm('現在の全データをバックアップの内容で置き換えます。よろしいですか？'))return;let t=db.transaction(['accounts','posts','settings'],'readwrite');for(let name of ['accounts','posts','settings'])t.objectStore(name).clear();data.accounts.forEach(x=>t.objectStore('accounts').put(x));data.posts.forEach(x=>t.objectStore('posts').put(x));Object.entries(data.settings||{}).forEach(([key,value])=>t.objectStore('settings').put({key,value}));await txDone(t);await refresh();stack=[];tab='home';render();toast('復元が完了しました')}catch(e){toast('復元に失敗しました。JSONファイルと保存容量を確認してください')}}let touch=null;document.addEventListener('touchstart',e=>{let el=e.target.closest('[data-swipe]');if(!el)return;let t=e.touches[0];touch={id:el.dataset.swipe,x:t.clientX,y:t.clientY,time:Date.now(),axis:null}},{passive:true});document.addEventListener('touchmove',e=>{if(!touch)return;let t=e.touches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;if(!touch.axis&&Math.hypot(dx,dy)>20)touch.axis=Math.abs(dx)>Math.abs(dy)?'x':'y'},{passive:true});document.addEventListener('touchend',e=>{if(!touch)return;let t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y,p=posts.find(x=>x.id===touch.id);if(p&&touch.axis==='x'&&(Math.abs(dx)>window.innerWidth*.25||(Math.abs(dx)>35&&Date.now()-touch.time<250))){let n=photoIndex[p.id]||0;photoIndex[p.id]=Math.max(0,Math.min(p.photos.length-1,n+(dx<0?1:-1)));updatePhoto(p.id)}touch=null},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length)back()});(async()=>{try{await openDB();await refresh();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}catch(e){$('#app').innerHTML='<div class="empty">データを読み込めませんでした。<br><button class="primary" onclick="location.reload()">再試行</button></div>'}})();
</script></body></html>
